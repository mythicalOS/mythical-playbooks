# agent-config.conf — per-role model + effort for start-agent.sh
#
# Whitespace-delimited rows: <role>  <model>  <effort>
#   role   : explorer | designer | devil | ops | cto | lead | worker | pm | architect | qa | reviewer | default
#   model  : a `claude --model` value — an alias (e.g. opus, sonnet) or a full id;
#            '-' = inherit the harness default
#   effort : low | medium | high | xhigh | max; '-' = inherit the harness/settings default
#
# The 'default' row applies to any role not listed below. A role row overrides
# the default row. start-agent.sh appends --model / --effort only when the value
# is set (not '-'), so an unset value inherits the harness's own default.
#
# Comments start with '#', either on their own line or trailing a row
# (e.g. "lead  opus  xhigh  # heavy reasoning"); trailing comments are stripped.
#
# Override the file location with AGENT_CONFIG_FILE in the environment.

# role       model    effort
default      opus     -
cto          opus     max    # apex / org-strategy — judgment-heavy
lead         opus     -
pm           opus     xhigh  # judgment-heavy
architect    opus     max    # judgment-heavy
worker       opus     -
qa           sonnet   -
reviewer     opus     xhigh
explorer     opus     -      # read-only recon; bump to high/xhigh for large unfamiliar codebases
designer     opus     -      # visual/interaction judgment; design-system artefacts
devil        opus     max    # operator-only sparring; judgment-heavy, chat-only
ops          opus     -      # intentional: read-only production observation; bump only for incident/strategic analysis
